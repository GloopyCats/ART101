<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an item from input</title>
    <link rel="stylesheet" href="garden.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="garden.js" defer></script>
</head>
<body>
    <!--<label for="item-label">Item label</label>
    <div class="controls">
        <input id="item-label" type="text" autocomplete="off">
        <button id="add-button" type="button">Add</button>
    </div>
    <p id="message" aria-live="polite"></p>
    <ul id="items" aria-live="polite"></ul>-->


<p>Choose a label, color and shape, then click Apply.</p>
    <p id="message" aria-live="polite"></p>
    <label for="object-label">Label</label>
    <input id="object-label" type="text" value="Example" maxlength="16">
    <div id="options">
        <div>
            <label for="object-color">Color</label>
            <input id="object-color" type="color" value="#d9d9d3">
        </div>
        <div>
            <label for="object-shape">Shape</label>
            <!-- The option values match the CSS class names. -->
            <select id="object-shape">
                <option value="square">Square</option>
                <option value="circle">Circle</option>
            </select>
        </div>
    </div>
    <button id="apply-button" type="button">Apply</button>
    <div id="object" class="square">
        <span id="preview-label" aria-live="polite">Example</span>
    </div>

    <div id="items" aria-live="polite"></div>

</body>
</html>
